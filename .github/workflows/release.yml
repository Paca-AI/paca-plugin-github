name: Build and Release Plugin Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup TinyGo
        run: |
          set -euo pipefail
          curl -sL -o /tmp/tinygo.deb https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb
          sudo dpkg -i /tmp/tinygo.deb

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build backend WASM
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p ../release/backend
          tinygo build -target=wasip1 -buildmode=c-shared -o ../release/backend/github.wasm .

      - name: Build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Build MCP
        working-directory: mcp
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release/frontend
          cp -R frontend/dist release/frontend/dist

          mkdir -p release/mcp
          cp -R mcp/dist release/mcp/dist

          mkdir -p release/migrations
          cp -R backend/migrations/. release/migrations/

          mkdir -p release/skills
          cp -R skills/. release/skills/

          cp plugin.json release/plugin.json

      - name: Create archives
        run: |
          set -euo pipefail
          tar -czf github-backend-wasm.tar.gz -C release/backend github.wasm
          tar -czf github-frontend-dist.tar.gz -C release/frontend dist
          tar -czf github-mcp-dist.tar.gz -C release/mcp dist
          tar -czf github-migrations.tar.gz -C release migrations
          tar -czf github-skills-bundle.tar.gz -C release skills
          tar -czf github-plugin-manifest.tar.gz -C release plugin.json

      - name: Generate checksums
        run: |
          set -euo pipefail
          sha256sum github-backend-wasm.tar.gz \
            github-frontend-dist.tar.gz \
            github-mcp-dist.tar.gz \
            github-migrations.tar.gz \
            github-skills-bundle.tar.gz \
            github-plugin-manifest.tar.gz > checksums.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            github-backend-wasm.tar.gz
            github-frontend-dist.tar.gz
            github-mcp-dist.tar.gz
            github-migrations.tar.gz
            github-skills-bundle.tar.gz
            github-plugin-manifest.tar.gz
            checksums.txt
